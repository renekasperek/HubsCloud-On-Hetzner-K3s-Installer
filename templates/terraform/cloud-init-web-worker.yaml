#cloud-config
package_update: true
packages:
  - curl

users:
  - name: cluster
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: sudo
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /usr/local/sbin/hcce-stage
    content: |
      #!/bin/bash
      stage="$${1:-unknown}"
      mkdir -p /var/run 2>/dev/null || true
      echo "$stage" > /var/run/hcce-bootstrap.stage
      echo "$(date -Is) [stage] $stage" >> /var/log/cloud-init-custom.log
    permissions: "0755"
  - path: /usr/local/sbin/hcce-wait-api
    content: |
      #!/bin/bash
      # Wait until the k3s supervisor at $1 serves bootstrap data.
      # We probe /cacerts because that is exactly the first call a joining
      # server makes, and it is served unauthenticated (HTTP 200).
      # Do NOT probe /readyz or /version with `curl -f`: both return 401 to
      # anonymous callers on k3s, so -f turns a healthy master into an
      # infinite wait loop.
      #   200      -> serving, safe to join
      #   401/403  -> answering but auth-gated -> proceed
      #   000/5xx  -> unreachable or not ready -> keep waiting
      host="$1"
      max="$${2:-120}"
      for i in $(seq 1 "$max"); do
        # curl -w ALWAYS writes a status code (000 when it cannot connect) and
        # ALSO exits non-zero on failure. Never append "|| echo 000" here: that
        # produces "000\n000", which stops matching the 000 case and makes the
        # loop fall through to "proceed" against a master that is not up.
        code=$(curl -k -s -o /dev/null -w '%%{http_code}' --connect-timeout 5 --max-time 10 "https://$host:6443/cacerts" 2>/dev/null)
        [ -z "$code" ] && code=000
        # Only these mean "the supervisor is answering". Anything else — 000,
        # 5xx, or something unexpected — must WAIT. An unknown value is never
        # treated as success.
        case "$code" in
          200)     echo "$host serving bootstrap data (HTTP 200)"; exit 0 ;;
          401|403) echo "$host API answering (HTTP $code) — proceeding"; exit 0 ;;
        esac
        echo "Waiting for $host supervisor (HTTP $code)..."
        sleep 10
      done
      echo "Timed out waiting for $host"
      exit 1
    permissions: "0755"
  - path: /usr/local/sbin/hcce-detect-private-iface
    content: |
      #!/bin/bash
      set +e
      for i in $(seq 1 30); do
        PRIMARY="$(ip -4 route show default 2>/dev/null | awk '/default/{print $5; exit}')"
        for iface in $(ls /sys/class/net/ 2>/dev/null); do
          case "$iface" in
            lo|docker*|veth*|cni*|flannel*|kube*|br-*|virbr*|tun*|tap*) continue ;;
          esac
          [ -e "/sys/class/net/$iface/device" ] || continue
          [ "$iface" = "$PRIMARY" ] && continue
          echo "$iface"
          exit 0
        done
        sleep 2
      done
      exit 1
    permissions: "0755"

bootcmd:
  - sleep 5
  - mkdir -p /var/run
  - echo starting > /var/run/hcce-bootstrap.stage

runcmd:
  - /usr/local/sbin/hcce-stage detect-private-iface
  - PRIV=$(/usr/local/sbin/hcce-detect-private-iface); echo "$PRIV" > /var/run/hcce-private-iface

  - /usr/local/sbin/hcce-stage kernel-prep
  - sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

  # NOTE: do NOT add a "scope link" route for 10.0.0.0/16 here. Hetzner Cloud
  # networks route peer traffic via the gateway 10.0.0.1 and never answer ARP
  # for peer IPs. DHCP already installs the correct "via 10.0.0.1" route; a
  # scope-link route has metric 0, wins over it, and blackholes the private
  # network ("no route to host" on 10.0.1.x).

  - /usr/local/sbin/hcce-stage wait-master-api
  - sleep 30
  # Fatal on timeout: joining a master that is not serving just burns the
  # retry budget and ends in failed:k3s-join with a misleading cause.
  - /usr/local/sbin/hcce-wait-api 10.0.1.1 120 || { /usr/local/sbin/hcce-stage failed:master-unreachable; exit 1; }

  # Stagger behind webrtc-worker so etcd sees HA-server joins one at a time.
  # Bounded at 60 tries (~10 min) and non-fatal: if webrtc never comes up we
  # still join rather than blocking the whole cluster on it.
  - /usr/local/sbin/hcce-stage wait-webrtc-joined
  - /usr/local/sbin/hcce-wait-api 10.0.1.2 60 || echo "webrtc-worker not ready after 10m — joining anyway"

  - |
    PRIV=$(cat /var/run/hcce-private-iface)
    for attempt in 1 2 3; do
      /usr/local/sbin/hcce-stage "k3s-install-$${attempt}"
      # Re-confirm the master before each attempt — it may have restarted, and a
      # retry against a down master wastes the budget. Returns immediately when up.
      /usr/local/sbin/hcce-wait-api 10.0.1.1 120 || { /usr/local/sbin/hcce-stage failed:master-unreachable; exit 1; }
      if curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.36.2+k3s1 INSTALL_K3S_EXEC="server --server https://10.0.1.1:6443 --token=${k3s_token} --kubelet-arg=cloud-provider=external --flannel-iface=$PRIV --node-ip=10.0.1.3 --disable-cloud-controller --disable traefik" sh -; then
        sleep 10
        if systemctl is-active --quiet k3s; then break; fi
      fi
      if [ "$attempt" = "3" ]; then
        /usr/local/sbin/hcce-stage failed:k3s-join
        exit 1
      fi
      /usr/local/bin/k3s-killall.sh 2>/dev/null || true
      /usr/local/bin/k3s-uninstall.sh 2>/dev/null || true
      sleep 30
    done

  - /usr/local/sbin/hcce-stage wait-k3s-active
  - sleep 15
  - while ! systemctl is-active --quiet k3s; do echo "Waiting for K3s server to start..."; sleep 5; done

  - /usr/local/sbin/hcce-stage setup-user
  - mkdir -p /home/cluster
  - chown cluster:cluster /home/cluster
  - chmod 755 /home/cluster
  - mkdir -p /home/cluster/.ssh
  - if [ -f /root/.ssh/authorized_keys ]; then cp /root/.ssh/authorized_keys /home/cluster/.ssh/authorized_keys; fi
  - chown -R cluster:cluster /home/cluster/.ssh
  - chmod 700 /home/cluster/.ssh
  - if [ -f /home/cluster/.ssh/authorized_keys ]; then chmod 600 /home/cluster/.ssh/authorized_keys; fi

  - /usr/local/sbin/hcce-stage done
  - systemctl status k3s >> /var/log/cloud-init-custom.log 2>&1
