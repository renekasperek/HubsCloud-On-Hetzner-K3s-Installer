#cloud-config
package_update: true
packages:
  - curl

users:
  - name: cluster
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: sudo
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /etc/netplan/51-hcce-private.yaml
    content: |
      network:
        version: 2
        ethernets:
          enp7s0:
            dhcp4: true
            dhcp4-overrides:
              route-metric: 100
    permissions: "0644"
  - path: /usr/local/sbin/hcce-stage
    content: |
      #!/bin/bash
      stage="${1:-unknown}"
      echo "$stage" > /var/run/hcce-bootstrap.stage
      echo "$(date -Is) [stage] $stage" >> /var/log/cloud-init-custom.log
    permissions: "0755"

bootcmd:
  - sleep 5
  - echo starting > /var/run/hcce-bootstrap.stage

runcmd:
  - /usr/local/sbin/hcce-stage netplan
  - netplan apply || true
  - |
    set -euo pipefail
    MASTER="10.0.1.1"
    /usr/local/sbin/hcce-stage wait-private-network
    for i in $(seq 1 60); do
      ip link set enp7s0 up 2>/dev/null || true
      if ip -4 -o addr show dev enp7s0 2>/dev/null | grep -q 'inet '; then
        break
      fi
      netplan apply 2>/dev/null || true
      sleep 5
    done
    if ! ip -4 -o addr show dev enp7s0 2>/dev/null | grep -q 'inet '; then
      /usr/local/sbin/hcce-stage failed:enp7s0-no-ip
      exit 1
    fi

    /usr/local/sbin/hcce-stage wait-master-grace
    sleep 30

    /usr/local/sbin/hcce-stage wait-master-api
    while ! curl -k -sf --connect-timeout 5 --max-time 10 "https://${MASTER}:6443/version" >/dev/null 2>&1; do
      sleep 10
    done

    /usr/local/sbin/hcce-stage wait-master-readyz
    while ! curl -k -sf --connect-timeout 5 --max-time 10 "https://${MASTER}:6443/readyz" >/dev/null 2>&1; do
      sleep 10
    done

  - |
    set -euo pipefail
    K3S_EXEC='server --server https://10.0.1.1:6443 --token=${k3s_token} --flannel-iface=enp7s0 --node-ip=10.0.1.2 --disable-cloud-controller --disable traefik'
    for attempt in $(seq 1 5); do
      /usr/local/sbin/hcce-stage "k3s-join-${attempt}"
      if curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="$K3S_EXEC" sh -; then
        break
      fi
      /usr/local/bin/k3s-killall.sh 2>/dev/null || true
      /usr/local/bin/k3s-uninstall.sh 2>/dev/null || true
      if [ "$attempt" -eq 5 ]; then
        /usr/local/sbin/hcce-stage failed:k3s-join
        exit 1
      fi
      sleep 30
    done

  - /usr/local/sbin/hcce-stage wait-k3s-active
  - sleep 15
  - while ! systemctl is-active --quiet k3s; do sleep 5; done

  - /usr/local/sbin/hcce-stage setup-user
  - mkdir -p /home/cluster
  - chown cluster:cluster /home/cluster
  - chmod 755 /home/cluster
  - mkdir -p /home/cluster/.ssh
  - if [ -f /root/.ssh/authorized_keys ]; then cp /root/.ssh/authorized_keys /home/cluster/.ssh/authorized_keys; fi
  - chown -R cluster:cluster /home/cluster/.ssh
  - chmod 700 /home/cluster/.ssh
  - if [ -f /home/cluster/.ssh/authorized_keys ]; then chmod 600 /home/cluster/.ssh/authorized_keys; fi

  - /usr/local/sbin/hcce-stage done
  - systemctl status k3s >> /var/log/cloud-init-custom.log 2>&1
