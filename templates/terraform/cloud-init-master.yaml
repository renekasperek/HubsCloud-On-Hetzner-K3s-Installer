#cloud-config
package_update: true
packages:
  - curl

users:
  - name: cluster
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: sudo
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /usr/local/sbin/hcce-stage
    content: |
      #!/bin/bash
      stage="$${1:-unknown}"
      mkdir -p /var/run 2>/dev/null || true
      echo "$stage" > /var/run/hcce-bootstrap.stage
      echo "$(date -Is) [stage] $stage" >> /var/log/cloud-init-custom.log
    permissions: "0755"
  - path: /usr/local/sbin/hcce-detect-private-iface
    content: |
      #!/bin/bash
      # Find the non-primary ethernet interface (private NIC). Names vary
      # across Hetzner images: enp7s0, ens10, eth1, ...
      set +e
      for i in $(seq 1 30); do
        PRIMARY="$(ip -4 route show default 2>/dev/null | awk '/default/{print $5; exit}')"
        for iface in $(ls /sys/class/net/ 2>/dev/null); do
          case "$iface" in
            lo|docker*|veth*|cni*|flannel*|kube*|br-*|virbr*|tun*|tap*) continue ;;
          esac
          [ -e "/sys/class/net/$iface/device" ] || continue
          [ "$iface" = "$PRIMARY" ] && continue
          echo "$iface"
          exit 0
        done
        sleep 2
      done
      exit 1
    permissions: "0755"

bootcmd:
  - sleep 5
  - mkdir -p /var/run
  - echo starting > /var/run/hcce-bootstrap.stage

runcmd:
  - /usr/local/sbin/hcce-stage detect-private-iface
  - PRIV=$(/usr/local/sbin/hcce-detect-private-iface); echo "$PRIV" > /var/run/hcce-private-iface

  # Ubuntu 24.04: AppArmor's userns restriction breaks containerd sandbox creation.
  - /usr/local/sbin/hcce-stage kernel-prep
  - sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

  # NOTE: do NOT add a "scope link" route for 10.0.0.0/16 here. Hetzner Cloud
  # networks route peer traffic via the gateway 10.0.0.1 and never answer ARP
  # for peer IPs. DHCP already installs the correct "via 10.0.0.1" route; a
  # scope-link route has metric 0, wins over it, and blackholes the private
  # network ("no route to host" on 10.0.1.x).

  - /usr/local/sbin/hcce-stage k3s-install
  # --kubelet-arg=cloud-provider=external is REQUIRED by hcloud-cloud-controller-manager.
  # Without it the CCM never sets spec.providerID (hcloud://<server-id>) on the node, so it
  # can create the Load Balancer but cannot map Kubernetes nodes to Hetzner servers — the LB
  # comes up with 0 targets and has to be attached by hand in the console.
  # Side effect: nodes register with the taint node.cloudprovider.kubernetes.io/uninitialized
  # until the CCM clears it. install_ccm_csi() gates on that; see wait_nodes_initialized().
  - PRIV=$(cat /var/run/hcce-private-iface); curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.36.2+k3s1 INSTALL_K3S_EXEC="server --cluster-init --disable-cloud-controller --kubelet-arg=cloud-provider=external --disable traefik --flannel-iface=$PRIV --cluster-cidr=10.42.0.0/16 --service-cidr=10.43.0.0/16 --node-name=$(hostname -f) --kube-controller-manager-arg=bind-address=0.0.0.0 --kube-proxy-arg=metrics-bind-address=0.0.0.0 --kube-scheduler-arg=bind-address=0.0.0.0 --tls-san=10.0.1.1 --tls-san=$(curl -s https://ipinfo.io/ip) --token=${k3s_token}" sh -

  - /usr/local/sbin/hcce-stage wait-k3s-config
  - sleep 15
  - while [ ! -f /etc/rancher/k3s/k3s.yaml ]; do echo "Waiting for K3s to start..."; sleep 5; done

  - /usr/local/sbin/hcce-stage setup-user
  - mkdir -p /home/cluster
  - chown cluster:cluster /home/cluster
  - chmod 755 /home/cluster
  - mkdir -p /home/cluster/.kube
  - if [ -f /etc/rancher/k3s/k3s.yaml ]; then cp /etc/rancher/k3s/k3s.yaml /home/cluster/.kube/config; fi
  - chown -R cluster:cluster /home/cluster/.kube
  - chmod 700 /home/cluster/.kube
  - if [ -f /home/cluster/.kube/config ]; then chmod 600 /home/cluster/.kube/config; fi
  - mkdir -p /home/cluster/.ssh
  - if [ -f /root/.ssh/authorized_keys ]; then cp /root/.ssh/authorized_keys /home/cluster/.ssh/authorized_keys; fi
  - chown -R cluster:cluster /home/cluster/.ssh
  - chmod 700 /home/cluster/.ssh
  - if [ -f /home/cluster/.ssh/authorized_keys ]; then chmod 600 /home/cluster/.ssh/authorized_keys; fi
  - if [ -f /etc/rancher/k3s/k3s.yaml ]; then chown cluster:cluster /etc/rancher/k3s/k3s.yaml; fi
  - if [ -f /var/lib/rancher/k3s/server/node-token ]; then chown cluster:cluster /var/lib/rancher/k3s/server/node-token; fi

  - /usr/local/sbin/hcce-stage done
  - systemctl status k3s >> /var/log/cloud-init-custom.log 2>&1
